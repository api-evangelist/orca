aid: orca
name: Orca
description: >-
  Orca is the leading user-friendly concentrated-liquidity automated market maker
  (AMM) on Solana, built around Whirlpools. Liquidity providers concentrate
  capital within custom price ranges for higher capital efficiency, traders swap
  tokens with dynamic Adaptive Fees, and creators launch tokens and lock
  liquidity for launches. Developers and autonomous agents integrate via the open
  Whirlpools SDKs (TypeScript, Rust, and a Python option) and the read-only Orca
  Public REST API (api.orca.so) for pool, token, lock, and protocol-wide data.
